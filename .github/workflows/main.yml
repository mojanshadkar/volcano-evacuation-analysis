name: Build and deploy MkDocs

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Show directory structure (pre-install)
        run: |
          pwd
          ls -la
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install MkDocs and common plugins (adjust as needed)
          pip install mkdocs mkdocs-material
          # If you have a requirements.txt file:
          # pip install -r requirements.txt
      
      - name: Debug MkDocs configuration
        run: |
          echo "Python version:"
          python --version
          echo "MkDocs version:"
          mkdocs --version
          echo "Checking mkdocs.yml:"
          cat mkdocs.yml || echo "mkdocs.yml not found!"
      
      - name: Deploy
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          mkdocs gh-deploy --force --verbose
